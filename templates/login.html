{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link
        rel="stylesheet"
        href="{% static 'css/login.css' %}"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>

<body>

<div class="login-container">

    <h2>Login</h2>

    <form
        id="loginForm"
        method="POST"
        action="{% url 'login' %}"
    >

        {% csrf_token %}


        <!-- EMAIL -->

        <label for="email">
            Email:
        </label>

        <div>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                value="{{ data.email|default:'' }}"
                required
            >

            {% if errors.email %}
                <small id="emailError" class="error-message">
                    {{ errors.email.0 }}
                </small>
            {% endif %}

        </div>


        <!-- PASSWORD -->

        <label for="password">
            Password:
        </label>

        <div class="form-group">

            <div class="password-wrapper"> 

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                >

                    <i 
                        id="passwordIcon"
                        class="bi bi-eye">
                    </i>

                </button>

            </div>

            {% if errors.password %}
                <small id="passwordError" class="error-message">
                    {{ errors.password.0 }}
                </small>
            {% endif %}

        </div>


        <!-- LOGIN ERROR -->

        {% if error %}

            <small id="loginError" class="error-message">
                {{ error }}
            </small>

        {% endif %}

        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <br>

    <!-- SIGNUP -->

    <div class="signup-link">

        Don't have an account?

        <a href="{% url 'signup' %}">
            Signup
        </a>

    </div>


</div>

<script src="{% static 'js/login.js' %}"></script>

</body>

</html>
